# MotionVectors - KNOWN-GOOD LIVE SETTINGS
#
# These are tuned values, not defaults. They were established during the
# shake / crawl / aliasing work and they live ONLY in %TEMP%\taa_live.ini,
# which is not part of the repo and is not captured by a folder backup.
#
# That cost a whole evening: three builds were restored and compared while
# this file quietly held probe values from hours earlier, so the comparison
# measured the settings rather than the builds. Deleting it is worse still -
# the layer regenerates it EMPTY, so every value silently falls back to a
# compiled default and the tuning is gone with no message anywhere.
#
# So it is version-controlled here, it travels with every backup, and
# tools/measure/settings.ps1 installs it.
taa.enable=1
taa.mode=2
taa.viz=0
taa.viz_scale=1.0

# blend
# Back to 0.05 (shipping default, known stable). Raising it sharpened the image
# but shimmered distant high-frequency geometry (city buildings in flight) -
# the long history is exactly what antialiases sub-pixel detail. So alpha stays
# LOW for stability and detail is recovered spatially by the RCAS sharpen pass
# (taa.sharpen), not by starving the temporal filter.
taa.alpha=0.05
taa.alpha_moving=0.35
# px/frame at which alpha_moving is fully applied. Ramped per PIXEL, because
# cameraMoved is frame-wide and true on a parked, trembling airframe.
taa.alpha_moving_px=3.0
taa.gain=4.0
taa.varclip=8.0
# Deadband on the clamp correction, in units of the noise floor.
# 0 = old behaviour, which pinned the blend weight at 1.0 and never accumulated.
taa.moved_dead=0.0
taa.novec_alpha=0.05
taa.reactive=0

# jitter - derived by the layer; unjitter stays OFF because resampling the
# current frame softens it and the softening accumulates into history
taa.jitter_scale=1.0
# Texture mip bias. Jitter accumulates sub-pixel detail the hardware mip choice
# would discard; this hands it back. LAUNCH-TIME ONLY - samplers are immutable
# and X-Plane creates them all at load, so changing it needs a restart.
taa.lod_bias=0.0
taa.unjitter=1
# Catmull-Rom history resampling. Bilinear compounds a blur once per frame
# for as long as history lives - the motion-only, surface-locked smear.
taa.hist_catmull=1

# ---- POST-RESOLVE SHARPEN (RCAS-style, MODE_SHARPEN).
# Recovers the detail the temporal filter averages away WITHOUT shortening
# history (which shimmers distant geometry). Runs on a dedicated buffer so it
# never feeds back into the accumulation. 0 = off. Contrast-limited, so it
# cannot ring; higher just bites harder. Tune 0.2 (subtle) .. 0.8 (crisp).
taa.sharpen=0.5
# Ambient occlusion, computed in the resolve from the clip w in the velocity
# target. 0 = off (no taps taken). Radius is in pixels at render resolution.
taa.ao=0.5
# Contact shadows: short, hard, sun-directional shadowing that the shadow map is
# too coarse to resolve - gear and struts on a sunlit ramp, panel seams, the
# edge of a wing on tarmac. Distinct from taa.ao, which is omnidirectional and
# present whether or not the sun is out. 0 takes no taps and costs nothing, as
# does night: the plugin zeroes the sun vector below the horizon.
taa.contact=0.6
taa.ao_radius=12.0
taa.smul_x=0.5
taa.smul_y=-0.5

# vectors
taa.vel_scale=1.0
taa.vel_ypos=0
taa.vel_max=1.0
taa.moved_eps=0.0001
taa.clear_mode=1
taa.nearfield_m=2.0
# -1 AUTO (any airframe-mounted view: 1000/1017/1018/1026), 0 never, >1000 pin one.
# Arming on 1018 alone left the 3-D cockpit (1026) disarmed - the cockpit shake.
taa.nearfield_view=-1
taa.mv_pass=-1
# -1 AUTO (latch only while an ordinal is pinned), 0 never, 1 always.
# Latching on 1 locked the 5-attachment G-buffer out and blacked the ground.
taa.sticky_colour=-1
taa.max_resolves=1
taa.quad_needs_depth=1
# 1 = a zero-attribute pipeline must ALSO read a storage buffer to be patched.
# Depth alone rescued the post-process quads, which stamp the whole frame.
taa.quad_needs_pull=1
taa.scene_needs_depth=1

# probes - ALL OFF. Each of these has cost real time by being left set.
taa.no_motion=0
taa.no_accum=0
taa.freeze_history=0
taa.force_reset=0
taa.novec_by_vel=0
taa.novec_cov=-1.0
taa.coverage=0
report=0
report.every=120

# Recycle pool cap while the zone is RED or CRITICAL, in MB. 0 = do not
# retain device-local blocks under pressure at all (the old behaviour).
vram.recycle_pressure_mb=64

# ---- X-Plane FSR takeover (in development)
# 0 = X-Plane's FSR works exactly as Laminar intended.
# 1 = X-Plane's FSR toggle drives OUR upscaler: the sim renders below display
#     resolution through its own supported path, and this layer takes over the
#     upscale step. Nothing writes the output yet, so the frame will look wrong
#     with this on - that is the interception working.
fsr.replace=0

# ---- TAAU (stage 0: spatial upscale, plumbing proof)
# Writes X-Plane's own upscaled output image from our compute dispatch. Needs
# X-Plane's render scale below 100% (there is no upscale pass to take over
# otherwise) and fsr.replace=1 (the probe that NAMES the output image works by
# stamping a sentinel from our substituted shader).
# taau_split is the fraction of screen WIDTH we write; the rest stays
# X-Plane's own upscale, so the seam down the middle is a live A/B.
taa.taau=0
taa.taau_split=0.5
taa.taau_sharp=1.0
taa.taau_tint=0
# Weight of the current frame. LOWER than the resolve's alpha on purpose: at
# this ratio one frame carries only (in/out)^2 of the output's samples, so the
# detail comes from many frames landing on different sub-pixel positions.
taa.taau_alpha=0.12
# Neighbourhood clip width in sigma. Lower = history rejected sooner (less
# ghosting, more shimmer); higher = smoother but more prone to trails.
taa.taau_gain=4.0
# Draw the blend weight instead of the image: white = taking the current frame
# outright (disocclusion, sky), black = fully accumulated.
taa.taau_show_alpha=0

# ---- SSGI: the indirect bounce light X-Plane does not compute
# Half-resolution rays marched through the engine's own depth buffer. A ray
# that hits reads the HDR scene colour there; a ray that ESCAPES the screen
# reads the engine's environment probe cube, which is what stops the picture
# falling apart at the frame edge the way plain screen-space GI does.
# Needs taa.engine_depth=1 (the depth tap). Probes are optional but are the
# whole reason escaped rays are not black.
taa.gi=0
# How far a ray travels, in METRES. Small = tight contact bounce; large =
# broad room-scale light and more chance of leaving the screen.
taa.gi_radius=6.0
# How thick a surface is assumed to be when testing a hit, in metres. Too
# small and rays pass through walls; too large and distant silhouettes count
# as occluders and paint the frame with foreground colour.
taa.gi_thickness=0.5
# And the ray's ceiling in HALF-RES PIXELS, which is what the march actually
# cares about. A fixed 6 m ray subtends 13,910 px at 0.5 m and 23 px at 300 m:
# without this cap the cockpit would be marched in ~1,700 px leaps that step
# over every object. 48 px across 10 steps is ~4.8 px per step.
taa.gi_max_px=48.0
# Rays per pixel per frame, and steps per ray. Four rays is far too noisy to
# show directly - the accumulator is what turns it into an integral.
taa.gi_rays=4
taa.gi_steps=10
# History blend. Low, because the noise has to average over many frames.
taa.gi_alpha=0.08
# Gain applied at composite time. 0 = off. The gather stores radiance RELATIVE
# to the surface's own luminance - dimensionless - so this is an O(1) knob:
# 0.5 is a moderate lift, 1.0 strong. Storing raw HDR radiance instead would
# have made the usable range 0.0002 (the engine's probes measure in the
# thousands), which is not a knob anyone can tune.
taa.gi_strength=0.5
